spring:
  datasource:
    url: jdbc:h2:mem:hotel_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    type: simple

app:
  jwt:
    secret: TestJwtSecretKeyForSpotkiHotelIntegrationTestsMustBeLongEnough12345
    expiration-ms: 3600000
    refresh-expiration-ms: 86400000
  token-store:
    redis: false
