spring:
  application:
    name: spotki-hotel-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hotel_manager}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: ${CACHE_TYPE:redis}
    redis:
      time-to-live: 600000

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:SpotkiHotelSuperSecretKeyForJwtSigning2026MustBeAtLeast32BytesLong!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  token-store:
    redis: ${TOKEN_STORE_REDIS:true}
  rate-limit:
    auth:
      max-requests: ${AUTH_RATE_LIMIT_MAX:20}
      window-seconds: ${AUTH_RATE_LIMIT_WINDOW_SEC:60}
  hotel:
    vat-rate: 0.08
    deposit-rate: 0.50
    loyalty-vnd-per-point: 10000

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
